<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoC WebXR Hit-test</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  #info { position: fixed; top: 8px; left: 8px; z-index: 2; background: rgba(0,0,0,.7);
          color: #0f0; padding: 8px; font-size: 13px; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="info">Loading...</div>
<script type="module">
import * as THREE from "three";
import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js";

const info = document.getElementById("info");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

// Vòng xanh: vị trí mặt phẳng camera đang trỏ tới
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x00ff00 })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// Quả cầu cam: đặt khi chạm màn hình
const placed = [];
const orbGeo = new THREE.SphereGeometry(0.05, 32, 32);
const orbMat = new THREE.MeshStandardMaterial({ color: 0xff8800 });

let hitTestSource = null, localSpace = null, viewerSpace = null;
let hitFrames = 0, totalFrames = 0, lastT = performance.now(), fps = 0;

document.body.appendChild(ARButton.createButton(renderer, {
  requiredFeatures: ["hit-test"]
}));

renderer.xr.addEventListener("sessionstart", async () => {
  const session = renderer.xr.getSession();
  viewerSpace = await session.requestReferenceSpace("viewer");
  localSpace = await session.requestReferenceSpace("local");
  hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
  session.addEventListener("select", () => {
    if (!reticle.visible) return;
    const orb = new THREE.Mesh(orbGeo, orbMat);
    orb.position.setFromMatrixPosition(reticle.matrix);
    scene.add(orb);
    placed.push(orb);
  });
});

renderer.xr.addEventListener("sessionend", () => {
  hitTestSource = null;
  reticle.visible = false;
});

renderer.setAnimationLoop((time, frame) => {
  totalFrames++;
  const now = performance.now();
  if (now - lastT >= 1000) {
    fps = totalFrames / ((now - lastT) / 1000);
    totalFrames = 0; lastT = now;
  }

  if (frame && hitTestSource) {
    const results = frame.getHitTestResults(hitTestSource);
    if (results.length > 0) {
      const pose = results[0].getPose(localSpace);
      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);
      hitFrames++;
    } else {
      reticle.visible = false;
    }
    info.textContent =
      `FPS: ${fps.toFixed(1)}\n` +
      `Mặt phẳng tìm thấy: ${reticle.visible ? "có" : "chưa"}\n` +
      `Số khung có hit-test: ${hitFrames}\n` +
      `Vật đã đặt: ${placed.length}\n` +
      `Chạm màn hình để đặt quả cầu.`;
  } else if (!frame) {
    info.textContent = "Nhấn nút Start AR ở dưới màn hình.";
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
